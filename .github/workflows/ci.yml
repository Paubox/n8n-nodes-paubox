name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        # eslint-plugin-n8n-nodes-base checks the conventions n8n requires of a
        # community node. It was a devDependency that only ran on publish.
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Assert the build produced what package.json promises
        run: node .github/scripts/assert_build_output.js
